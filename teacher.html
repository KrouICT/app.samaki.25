<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>គ្រូបង្រៀន - អនុវិទ្យាល័យសាមគ្គី</title>
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/4/4a/Emblem_of_the_Ministry_of_Education%2C_Youth_and_Sport_%28Cambodia%29.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&family=Moul&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2C6E49;
            --secondary-green: #4C956C;
            --accent-yellow: #FEC868;
            --light-bg: #f9fafb;
            --dark-text: #1f2d3d;
            --border-color: #e5e7eb;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Battambang', sans-serif;
            background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
            min-height: 100vh;
        }

        /* Login Container */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        .login-header h1 {
            color: var(--primary-green);
            font-family: 'Moul', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--dark-text);
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Battambang', sans-serif;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Battambang', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(44, 110, 73, 0.3);
        }

        .error-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            background-color: #fee;
            color: #dc3545;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Dashboard */
        .dashboard-container {
            display: none;
            background: #f3f4f6;
            min-height: 100vh;
        }

        .dashboard-container.show {
            display: block;
        }

        .dashboard-header {
            background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
            color: white;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .dashboard-header h2 {
            font-family: 'Moul', sans-serif;
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Battambang', sans-serif;
        }

        .logout-btn:hover {
            background: white;
            color: var(--primary-green);
        }

        .dashboard-content {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .search-filter-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-text);
        }

        .filter-group input,
        .filter-group select {
            padding: 10px 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Battambang', sans-serif;
        }

        .btn-clear {
            padding: 10px 24px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Battambang', sans-serif;
            transition: all 0.3s ease;
        }

        .btn-clear:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .students-table-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .students-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        .students-table thead {
            background: var(--primary-green);
            color: white;
        }

        .students-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        .students-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .students-table tbody tr:hover {
            background-color: #f0f7ff;
            cursor: pointer;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-male {
            background: #e3f2fd;
            color: #1565c0;
        }

        .badge-female {
            background: #fce4ec;
            color: #c2185b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-card i {
            font-size: 2rem;
            color: var(--primary-green);
            margin-bottom: 10px;
        }

        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark-text);
        }

        .stat-card .stat-label {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner i {
            color: var(--primary-green);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        /* Student Detail Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .modal-header h3 {
            color: var(--primary-green);
            font-family: 'Moul', sans-serif;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--primary-green);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-item {
            padding: 15px;
            background: var(--light-bg);
            border-radius: 8px;
        }

        .detail-item strong {
            display: block;
            color: #6b7280;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .detail-item span {
            font-size: 1.1rem;
            color: var(--dark-text);
            font-weight: 500;
        }

        .phone-link {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
        }

        .phone-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .dashboard-content {
                padding: 15px;
            }

            .search-filter-card {
                padding: 20px;
            }

            .students-table-card {
                padding: 15px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .students-table {
                font-size: 0.9rem;
            }

            .students-table th,
            .students-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Container -->
    <div class="login-wrapper" id="loginWrapper">
        <div class="login-container">
            <div class="login-header">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Emblem_of_the_Ministry_of_Education%2C_Youth_and_Sport_%28Cambodia%29.svg" alt="Logo">
                <h1>ចូលប្រព័ន្ធគ្រូបង្រៀន</h1>
                <p>អនុវិទ្យាល័យសាមគ្គី</p>
            </div>

            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="teacherId"><i class="fas fa-id-card"></i> អត្តលេខគ្រូ / ID</label>
                    <input type="text" id="teacherId" placeholder="បញ្ចូលអត្តលេខ" required>
                </div>

                <div class="form-group">
                    <label for="teacherPassword"><i class="fas fa-lock"></i> លេខសម្ងាត់</label>
                    <input type="password" id="teacherPassword" placeholder="បញ្ចូលលេខសម្ងាត់" required>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> ចូលប្រព័ន្ធ
                </button>
            </form>
        </div>
    </div>

    <!-- Dashboard Container -->
    <div class="dashboard-container" id="dashboardContainer">
        <div class="dashboard-header">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <div>
                    <h2><i class="fas fa-chalkboard-teacher"></i> ប្រព័ន្ធគ្រូបង្រៀន</h2>
                    <p id="welcomeText" style="margin: 0; opacity: 0.9;"></p>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> ចាកចេញ
                </button>
            </div>
        </div>

        <div class="dashboard-content">
            <!-- Statistics -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <div class="stat-number" id="totalStudents">0</div>
                    <div class="stat-label">សិស្សសរុប</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-male"></i>
                    <div class="stat-number" id="maleStudents">0</div>
                    <div class="stat-label">សិស្សប្រុស</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-female"></i>
                    <div class="stat-number" id="femaleStudents">0</div>
                    <div class="stat-label">សិស្សស្រី</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-school"></i>
                    <div class="stat-number" id="totalGrades">0</div>
                    <div class="stat-label">ថ្នាក់សរុប</div>
                </div>
            </div>

            <!-- Search & Filter -->
            <div class="search-filter-card">
                <h4 style="color: var(--primary-green); margin-bottom: 20px;">
                    <i class="fas fa-search"></i> ស្វែងរក និងត្រងសិស្ស
                </h4>
                <div class="filter-grid">
                    <div class="filter-group">
                        <label for="searchName"><i class="fas fa-user"></i> ស្វែងរកតាមឈ្មោះ</label>
                        <input type="text" id="searchName" placeholder="វាយបញ្ចូលឈ្មោះ...">
                    </div>
                    <div class="filter-group">
                        <label for="filterGrade"><i class="fas fa-filter"></i> ត្រងតាមថ្នាក់</label>
                        <select id="filterGrade">
                            <option value="">-- ថ្នាក់ទាំងអស់ --</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterGender"><i class="fas fa-venus-mars"></i> ត្រងតាមភេទ</label>
                        <select id="filterGender">
                            <option value="">-- ភេទទាំងអស់ --</option>
                            <option value="ប្រុស">ប្រុស</option>
                            <option value="ស្រី">ស្រី</option>
                        </select>
                    </div>
                    <div class="filter-group" style="align-self: flex-end;">
                        <button class="btn-clear" id="clearBtn">
                            <i class="fas fa-redo"></i> សម្អាត
                        </button>
                    </div>
                </div>
            </div>

            <!-- Students Table -->
            <div class="students-table-card">
                <h4 style="color: var(--primary-green); margin-bottom: 20px;">
                    <i class="fas fa-list"></i> បញ្ជីសិស្ស
                </h4>
                <div id="tableContainer">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin fa-3x"></i>
                        <p>កំពុងផ្ទុកទិន្នន័យ...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Student Detail Modal -->
    <div class="modal-overlay" id="studentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-user-circle"></i> ព័ត៌មានលម្អិតសិស្ស</h3>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const SPREADSHEET_ID = '1FOxoZrYjGoqqxww9hqK1jVU298-gujpMJ7T7kz_h1F0';
        const API_KEY = 'AIzaSyCmWu60e8pf939POZxBlHjkRBT_FsLJSlI';

        const AppState = {
            allStudents: [],
            filteredStudents: [],
            currentUser: null
        };

        async function fetchSheetData(sheetName) {
            try {
                const response = await fetch(`/api/sheets?sheet=${encodeURIComponent(sheetName)}`);
                if (!response.ok) throw new Error('Failed to fetch');
                const data = await response.json();
                return data.values || [];
            } catch (error) {
                console.error('Error:', error);
                return [];
            }
        }

        async function validateLogin(id, password) {
            const data = await fetchSheetData('userLogin');
            if (data.length <= 1) return { success: false, message: 'មិនអាចភ្ជាប់ទៅកាន់ប្រព័ន្ធបានទេ' };

            const userRow = data.slice(1).find(row => row[0] === id && row[2] === password && row[3] === 'teacher');
            
            if (!userRow) {
                return { success: false, message: 'អត្តលេខ ឬលេខសម្ងាត់មិនត្រឹមត្រូវ' };
            }

            return { success: true, user: { id: userRow[0], grade: userRow[1], role: userRow[3] } };
        }

        async function loadStudentData() {
            const data = await fetchSheetData('forTeacher');
            if (data.length <= 1) {
                document.getElementById('tableContainer').innerHTML = '<div class="no-data"><i class="fas fa-inbox" style="font-size: 3rem; margin-bottom: 15px; color: #ddd;"></i><p>មិនមានទិន្នន័យសិស្ស</p></div>';
                return;
            }

            AppState.allStudents = data.slice(1).map(row => ({
                id: row[0],
                lastName: row[1],
                firstName: row[2],
                gender: row[3],
                dob: row[4],
                grade: row[5],
                village: row[6],
                commune: row[7],
                phone: row[8]
            }));

            AppState.filteredStudents = [...AppState.allStudents];
            updateStatistics();
            populateGradeFilter();
            renderTable();
        }

        function updateStatistics() {
            const total = AppState.allStudents.length;
            const male = AppState.allStudents.filter(s => s.gender === 'ប្រុស').length;
            const female = AppState.allStudents.filter(s => s.gender === 'ស្រី').length;
            const grades = [...new Set(AppState.allStudents.map(s => s.grade))].length;

            document.getElementById('totalStudents').textContent = total;
            document.getElementById('maleStudents').textContent = male;
            document.getElementById('femaleStudents').textContent = female;
            document.getElementById('totalGrades').textContent = grades;
        }

        function populateGradeFilter() {
            const grades = [...new Set(AppState.allStudents.map(s => s.grade))].sort();
            const select = document.getElementById('filterGrade');
            select.innerHTML = '<option value="">-- ថ្នាក់ទាំងអស់ --</option>' + 
                grades.map(g => `<option value="${g}">${g}</option>`).join('');
        }

        function renderTable() {
            const container = document.getElementById('tableContainer');
            
            if (AppState.filteredStudents.length === 0) {
                container.innerHTML = '<div class="no-data"><i class="fas fa-search-minus" style="font-size: 3rem; margin-bottom: 15px; color: #ddd;"></i><p>មិនមានលទ្ធផលស្វែងរក</p></div>';
                return;
            }

            const table = `
                <table class="students-table">
                    <thead>
                        <tr>
                            <th><i class="fas fa-hashtag"></i> លរ</th>
                            <th><i class="fas fa-id-card"></i> អត្តលេខ</th>
                            <th><i class="fas fa-user"></i> គោត្តនាម និងនាម</th>
                            <th><i class="fas fa-venus-mars"></i> ភេទ</th>
                            <th><i class="fas fa-school"></i> ថ្នាក់</th>
                            <th><i class="fas fa-map-marker-alt"></i> ភូមិ</th>
                            <th><i class="fas fa-phone"></i> លេខទូរស័ព្ទ</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${AppState.filteredStudents.map((s, i) => `
                            <tr onclick="showStudentDetail('${s.id}')">
                                <td>${i + 1}</td>
                                <td><strong>${s.id}</strong></td>
                                <td>${s.lastName} ${s.firstName}</td>
                                <td><span class="badge ${s.gender === 'ប្រុស' ? 'badge-male' : 'badge-female'}">${s.gender}</span></td>
                                <td><strong>${s.grade}</strong></td>
                                <td>${s.village}</td>
                                <td><a href="tel:${s.phone}" class="phone-link">${s.phone}</a></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            container.innerHTML = table;
        }

        function applyFilters() {
            const searchName = document.getElementById('searchName').value.toLowerCase();
            const filterGrade = document.getElementById('filterGrade').value;
            const filterGender = document.getElementById('filterGender').value;

            AppState.filteredStudents = AppState.allStudents.filter(student => {
                const fullName = `${student.lastName} ${student.firstName}`.toLowerCase();
                const matchName = fullName.includes(searchName);
                const matchGrade = !filterGrade || student.grade === filterGrade;
                const matchGender = !filterGender || student.gender === filterGender;
                return matchName && matchGrade && matchGender;
            });

            renderTable();
        }

        function showStudentDetail(studentId) {
            const student = AppState.allStudents.find(s => s.id === studentId);
            if (!student) return;

            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="detail-grid">
                    <div class="detail-item">
                        <strong><i class="fas fa-id-card"></i> អត្តលេខ</strong>
                        <span>${student.id}</span>
                    </div>
                    <div class="detail-item">
                        <strong><i class="fas fa-user"></i> នាមត្រកូល</strong>
                        <span>${student.lastName}</span>
                    </div>
                    <div class="detail-item">
                        <strong><i class="fas fa-user"></i> នាមខ្លួន</strong>
                        <span>${student.firstName}</span>
                    </div>
                    <div class="detail-item">
                        <strong><i class="fas fa-venus-mars"></i> ភេទ</strong>
                        <span class="badge ${student.gender === 'ប្រុស' ? 'badge-male' : 'badge-female'}">${student.gender}</span>
                    </div>
                    <div class="detail-item">
                        <strong><i class="fas fa-birthday-cake"></i> ថ្ងៃខែឆ្នាំកំណើត</strong>
                        <span>${student.dob || 'មិនមាន'}</span>
                    </div>
                    <div class="detail-item">
                        <strong><i class="fas fa-school"></i> ថ្នាក់</strong>
                        <span>${student.grade}</span>
                    </div>
                    <div class="detail-item">
                        <strong><i class="fas fa-map-marker-alt"></i> ភូមិ</strong>
                        <span>${student.village || 'មិនមាន'}</span>
                    </div>
                    <div class="detail-item">
                        <strong><i class="fas fa-location-arrow"></i> ឃុំ</strong>
                        <span>${student.commune || 'មិនមាន'}</span>
                    </div>
                    <div class="detail-item" style="grid-column: span 2;">
                        <strong><i class="fas fa-phone-alt"></i> លេខទូរស័ព្ទអាណាព្យាបាល</strong>
                        <span><a href="tel:${student.phone}" class="phone-link" style="font-size: 1.3rem;">${student.phone}</a></span>
                    </div>
                </div>
                <div style="margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px; text-align: center;">
                    <p style="margin: 0; color: #2e7d32; font-weight: 500;">
                        <i class="fas fa-info-circle"></i> ទំនាក់ទំនងបានលឿនបំផុតតាមរយៈលេខទូរស័ព្ទខាងលើ
                    </p>
                </div>
            `;

            document.getElementById('studentModal').classList.add('show');
        }

        // Event Listeners
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('teacherId').value.trim();
            const password = document.getElementById('teacherPassword').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> កំពុងពិនិត្យ...';
            errorMessage.classList.remove('show');

            const result = await validateLogin(id, password);

            if (result.success) {
                AppState.currentUser = result.user;
                document.getElementById('loginWrapper').style.display = 'none';
                document.getElementById('dashboardContainer').classList.add('show');
                document.getElementById('welcomeText').textContent = `សូមស្វាគមន៍ គ្រូបង្រៀន`;
                await loadStudentData();
            } else {
                document.getElementById('errorText').textContent = result.message;
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> ចូលប្រព័ន្ធ';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('តើអ្នកពិតជាចង់ចាកចេញពីប្រព័ន្ធមែនទេ?')) {
                location.reload();
            }
        });

        document.getElementById('searchName').addEventListener('input', applyFilters);
        document.getElementById('filterGrade').addEventListener('change', applyFilters);
        document.getElementById('filterGender').addEventListener('change', applyFilters);

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('searchName').value = '';
            document.getElementById('filterGrade').value = '';
            document.getElementById('filterGender').value = '';
            applyFilters();
        });

        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('studentModal').classList.remove('show');
        });

        document.getElementById('studentModal').addEventListener('click', (e) => {
            if (e.target.id === 'studentModal') {
                document.getElementById('studentModal').classList.remove('show');
            }
        });
    </script>
</body>
</html>
